<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Type Warriors Idea Forge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Cinzel:wght@500;700&family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one tall war-room page. Header, then the update timeline as a full-width rail, then the Idea Vault beside the selected update's board. */
:root{
 color-scheme:dark;
 --night:#0b0718;--panel:#1b1438;--panel2:#241a4a;--panel3:#2e2260;--ink:#12081f;--line:#3a2f5e;--line2:#54468a;
 --fg:#f4ecd8;--mute:#a99fc8;--dim:#7a70a0;
 --gold:#ffc94a;--gold2:#ffe48a;--gold3:#f5b928;--goldsh:#8a5a10;
 --green:#5ee08a;--blue:#6ab8ff;--violet:#a98aff;--pink:#ff6fae;--red:#ff6a7a;--cyan:#5ad8ff;
 --display:'Pirata One','Luminari','Papyrus',Georgia,serif;
 --head:'Cinzel',Georgia,'Times New Roman',serif;
 --body:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
 --r:14px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--night);color:var(--fg);font:400 14px/1.5 var(--body);-webkit-font-smoothing:antialiased;
 background-image:radial-gradient(ellipse 80% 50% at 15% -10%,#3a1a6a66,#0000 60%),radial-gradient(ellipse 60% 40% at 100% 0%,#5a1a4a44,#0000 60%),linear-gradient(#0b0718,#0a0614);background-attachment:fixed}
#stars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;max-width:1720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--ink);border-radius:999px;padding:8px 15px;font:600 13px/1 var(--body);background:var(--panel3);color:var(--fg);box-shadow:0 3px 0 #0a0516,inset 0 1px 0 #ffffff1a;transition:transform .08s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0a0516}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold3));color:#2a1604;box-shadow:0 3px 0 var(--goldsh),inset 0 1px 0 #fff8}
.btn.gold:active{box-shadow:0 1px 0 var(--goldsh)}
.btn.ghost{background:transparent;border-color:var(--line2);box-shadow:none}
.btn.danger{background:#4a1626;border-color:#12081f;color:#ffc0c8}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.icon{padding:7px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font:700 11px/1.3 var(--body);letter-spacing:.4px;color:var(--c,var(--mute));background:color-mix(in srgb,var(--c,#888) 16%,transparent);border:1px solid color-mix(in srgb,var(--c,#888) 45%,transparent);white-space:nowrap}
.chip svg.i{width:13px;height:13px}
.live{--c:var(--pink);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--pink) 18%,transparent)}}
.eyebrow{font:700 11px/1 var(--head);letter-spacing:2.4px;text-transform:uppercase;color:var(--gold)}
.panel{background:linear-gradient(180deg,color-mix(in srgb,var(--panel2) 92%,transparent),color-mix(in srgb,var(--panel) 96%,transparent));border:1.5px solid var(--line);border-radius:18px;box-shadow:0 0 0 1.5px var(--ink),0 18px 40px #0007,inset 0 1px 0 #ffffff12}
input[type=text],input[type=number],input[type=url],input[type=date],input[type=search],select,textarea{width:100%;background:#0e0920;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--fg);font-size:14px;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{resize:vertical;min-height:70px;line-height:1.5}
input[type=color]{width:42px;height:38px;border:1.5px solid var(--line);border-radius:10px;background:#0e0920;padding:3px}
label.f{display:flex;flex-direction:column;gap:5px;font:600 12px/1.2 var(--body);color:var(--mute);min-width:0}
label.f small{font-weight:400;color:var(--dim)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand canvas{width:54px;height:54px;flex:none;filter:drop-shadow(0 4px 10px #ffb02e44)}
.brand h1{margin:0;font:400 44px/.9 var(--display);letter-spacing:1.5px;background:linear-gradient(180deg,#fff6c0,#ffd76a 45%,#e89a2a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #12081f) drop-shadow(0 0 18px #ffb02e33)}
.brand p{margin:3px 0 0;font:500 11px/1 var(--head);letter-spacing:2.6px;text-transform:uppercase;color:var(--mute)}
.status{display:flex;gap:10px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:2px;padding:8px 14px;border-radius:14px;background:#0e0920cc;border:1.5px solid var(--line);min-width:0;cursor:pointer}
.stat:hover{border-color:var(--line2)}
.stat b{font:400 20px/1 var(--display);letter-spacing:.5px}
.stat small{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.stat .eyebrow{font-size:9.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);z-index:40;min-width:230px;padding:6px;display:flex;flex-direction:column}
.menu button{display:flex;gap:10px;align-items:center;text-align:left;background:none;border:0;border-radius:10px;padding:10px 12px;color:var(--fg);font-size:13px}
.menu button:hover{background:var(--panel3)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px;width:auto}

/* ---------- timeline ---------- */
.tlwrap{padding:14px 0 6px;overflow:hidden}
.tlhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:0 18px 10px}
.tlhead h2{margin:0;font:700 17px/1 var(--head);letter-spacing:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-right:auto;font-size:11.5px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}
.tl{position:relative;overflow-x:auto;overflow-y:hidden;height:340px;cursor:grab;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;overscroll-behavior-x:contain}
.tl.panning{cursor:grabbing}
.tltrack{position:relative;height:100%}
.tlmonth{position:absolute;top:0;height:100%;border-left:1px solid #ffffff14;padding:2px 0 0 8px;font:700 12px/1 var(--head);letter-spacing:2px;text-transform:uppercase;color:var(--mute);pointer-events:none}
.tlday{position:absolute;top:26px;transform:translateX(-50%);font:600 10px/1 var(--body);color:var(--dim);pointer-events:none;font-variant-numeric:tabular-nums}
.tlday.we{color:#5c5480}
.tltick{position:absolute;top:176px;width:1px;height:8px;background:#ffffff26;pointer-events:none}
.tlrail{position:absolute;left:0;right:0;top:178px;height:4px;border-radius:4px;background:linear-gradient(90deg,#5a3aa866,#ffc94a99 50%,#5a3aa866);box-shadow:0 0 14px #ffc94a55;pointer-events:none}
.tlpast{position:absolute;top:178px;height:4px;background:linear-gradient(90deg,#5ee08a55,#5ee08a);border-radius:4px;pointer-events:none}
.tltoday{position:absolute;top:40px;bottom:6px;width:2px;background:linear-gradient(#ff6fae,#ff6fae22);pointer-events:none}
.tltoday span{position:absolute;top:-2px;left:50%;transform:translateX(-50%);font:800 9.5px/1 var(--body);letter-spacing:1.5px;color:#2a0614;background:var(--pink);padding:3px 6px;border-radius:6px;white-space:nowrap}
.tldot{position:absolute;top:172px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--ink);border:3px solid var(--c);box-shadow:0 0 10px var(--c);pointer-events:none;z-index:2}
.tlstem{position:absolute;width:2px;margin-left:-1px;background:linear-gradient(var(--c),color-mix(in srgb,var(--c) 30%,transparent));pointer-events:none;opacity:.7}
.tn{position:absolute;width:140px;margin-left:-70px;height:70px;border-radius:14px;padding:8px 10px 7px 12px;background:linear-gradient(180deg,#2a1f56,#1a1236);border:1.5px solid color-mix(in srgb,var(--c) 70%,#12081f);box-shadow:0 0 0 1.5px var(--ink),0 8px 18px #0008;cursor:pointer;user-select:none;touch-action:none;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto auto;column-gap:6px;z-index:3;transition:box-shadow .15s,transform .15s}
.tn:hover{transform:translateY(-2px);z-index:5}
.tn.sel{border-color:var(--gold);box-shadow:0 0 0 1.5px var(--ink),0 0 0 4px #ffc94a55,0 0 26px #ffc94a55;z-index:6}
.tn.drag{z-index:20;cursor:grabbing;transform:scale(1.04)}
.tn.drop{border-color:var(--green);box-shadow:0 0 0 1.5px var(--ink),0 0 0 4px #5ee08a66}
.tn .v{font:400 24px/1 var(--display);color:var(--gold2);letter-spacing:.5px}
.tn .n{grid-column:1/3;font:600 12px/1.25 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn .d{grid-column:1/3;font:500 10.5px/1.2 var(--body);color:var(--mute);display:flex;gap:6px;justify-content:space-between}
.tn .cnt{align-self:start;font:700 10.5px/1 var(--body);padding:3px 6px;border-radius:7px;background:#0e0920;border:1px solid var(--line);color:var(--mute);display:inline-flex;gap:3px;align-items:center}
.tn .cnt svg.i{width:11px;height:11px}
.tn .lv{position:absolute;top:-9px;right:-6px;font:800 9px/1 var(--body);letter-spacing:1.2px;background:var(--pink);color:#2a0614;padding:3px 6px;border-radius:6px;border:1.5px solid var(--ink)}
.tn.ghost{background:transparent;border:1.5px dashed var(--line2);box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mute)}
.tn.ghost:hover{border-color:var(--gold);color:var(--gold2)}
.tn.ghost .v{color:inherit;font-size:22px}
.tn.ghost small{font-size:10.5px}
.tlhint{padding:6px 18px 0;font-size:11.5px;color:var(--dim)}
.dragtip{position:fixed;z-index:90;pointer-events:none;background:var(--gold);color:#2a1604;font:700 12px/1 var(--body);padding:6px 9px;border-radius:8px;border:1.5px solid var(--ink);transform:translate(-50%,-140%)}

/* ---------- work area ---------- */
.work{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr);gap:16px;align-items:start}
.vault{padding:16px;display:flex;flex-direction:column;gap:12px;position:sticky;top:12px;max-height:calc(100vh - 24px)}
.vhead{display:flex;align-items:center;gap:8px}
.vhead h2{margin:0;font:700 17px/1 var(--head);letter-spacing:1px;margin-right:auto}
.vhead .count{font:700 11px/1 var(--body);color:var(--mute);background:#0e0920;border:1px solid var(--line);padding:4px 8px;border-radius:8px}
.vfilters{display:flex;flex-direction:column;gap:8px}
.tfilter{display:flex;gap:5px;flex-wrap:wrap}
.tfilter button{border:1px solid var(--line);background:#0e0920;color:var(--mute);border-radius:999px;padding:4px 9px;font:600 11px/1.2 var(--body);display:inline-flex;gap:4px;align-items:center}
.tfilter button svg.i{width:12px;height:12px}
.tfilter button.on{color:var(--c,var(--gold2));border-color:var(--c,var(--gold));background:color-mix(in srgb,var(--c,var(--gold)) 15%,#0e0920)}
.seg{display:flex;background:#0e0920;border:1.5px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:6px 8px;font:600 12px/1 var(--body);color:var(--mute)}
.seg button.on{background:var(--panel3);color:var(--fg)}
.vlist{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:120px;padding:2px 4px 2px 0;margin-right:-4px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;border-radius:12px;transition:background .15s}
.vlist.drop{background:#5ee08a14;outline:1.5px dashed var(--green);outline-offset:2px}
.vi{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;background:#0e0920aa;border:1.5px solid var(--line);cursor:pointer;text-align:left;width:100%}
.vi:hover{border-color:var(--c)}
.vi .ti{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 16%,#0e0920);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);overflow:hidden}
.vi .ti img{width:100%;height:100%;object-fit:cover}
.vi b{display:block;font:600 13px/1.25 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vi small{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden}
.vi[draggable=true]{cursor:grab}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:22px 14px;color:var(--mute);border:1.5px dashed var(--line);border-radius:14px}
.empty b{color:var(--fg);font:700 14px/1.2 var(--head);letter-spacing:.5px}
.empty p{margin:0;font-size:12.5px;max-width:34ch}

/* ---------- board ---------- */
.board{overflow:hidden;min-width:0}
.hero{position:relative;min-height:260px;display:flex;align-items:flex-end;background:#0e0920;overflow:hidden}
.hero .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%;opacity:.72;cursor:zoom-in}
.hero .bg.none{background:radial-gradient(ellipse at 70% 20%,color-mix(in srgb,var(--hc,#5a3aa8) 35%,transparent),transparent 60%),radial-gradient(ellipse at 10% 100%,#ffc94a22,transparent 50%),#120a26;cursor:default}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0b071800 20%,#0b0718cc 70%,#0b0718f2);pointer-events:none}
.hcontent{position:relative;z-index:2;padding:22px 24px 20px;display:flex;flex-direction:column;gap:8px;width:100%;pointer-events:none}
.hcontent>*{pointer-events:auto}
.hcontent h2{margin:0;font:400 54px/.95 var(--display);letter-spacing:1px;color:#fff3c8;text-shadow:0 3px 0 #12081f,0 0 24px #ffb02e55;text-wrap:balance}
.hcontent .sum{margin:0;max-width:72ch;color:#e8def8;font-size:14px}
.hmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hactions{position:absolute;top:14px;right:14px;z-index:3;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.prog{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1.5px solid var(--line);background:#0e092066;flex-wrap:wrap}
.bar{flex:1;min-width:140px;height:10px;border-radius:99px;background:#0e0920;border:1px solid var(--line);overflow:hidden;display:flex}
.bar i{height:100%;background:var(--c)}
.prog small{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;padding:10px 16px 0;border-bottom:1.5px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px;border-radius:10px 10px 0 0;font:600 13px/1 var(--body);color:var(--mute);display:inline-flex;gap:7px;align-items:center;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.tabs button.on{color:var(--gold2);border-bottom-color:var(--gold)}
.tabs button i{font-style:normal;font-size:10.5px;background:#0e0920;border:1px solid var(--line);padding:2px 6px;border-radius:6px;color:var(--mute)}
.tbody{padding:18px 20px 22px;min-height:240px}
.tbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tbar .grow{min-width:120px}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ic{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:#0e0920;border:1.5px solid var(--line);cursor:pointer;text-align:left;padding:0;transition:border-color .15s,transform .15s}
.ic:hover{border-color:var(--c);transform:translateY(-2px)}
.ic .art{height:120px;background:radial-gradient(ellipse at 50% 120%,color-mix(in srgb,var(--c) 40%,transparent),transparent 70%),#140c2a;display:grid;place-items:center;color:var(--c);position:relative}
.ic .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ic .art svg.i{width:40px;height:40px;stroke-width:1.6;opacity:.85}
.ic .body{padding:11px 13px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ic h4{margin:0;font:700 15px/1.25 var(--head);letter-spacing:.3px}
.ic p{margin:0;font-size:12.5px;color:#d6cdea;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ic .meta{display:flex;gap:10px;font-size:11px;color:var(--mute);align-items:center;flex-wrap:wrap}
.ic .meta span{display:inline-flex;gap:4px;align-items:center}
.ic .meta svg.i{width:12px;height:12px}
.ic .chips{display:flex;gap:6px;flex-wrap:wrap}
.prio{display:inline-flex;gap:2px}
.prio i{width:6px;height:10px;border-radius:3px 3px 1px 1px;background:#3a2f5e}
.prio i.on{background:var(--gold);box-shadow:0 0 5px #ffc94a88}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.gal figure{margin:0;border-radius:14px;overflow:hidden;background:#0e0920;border:1.5px solid var(--line);position:relative;cursor:zoom-in}
.gal figure img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.gal figcaption{padding:7px 10px;font-size:11.5px;color:var(--mute);display:flex;gap:6px;align-items:center;justify-content:space-between}
.gal figcaption b{color:var(--fg);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gal .cov{position:absolute;top:8px;left:8px}
.links{display:flex;flex-direction:column;gap:8px}
.lk{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:#0e0920;border:1.5px solid var(--line)}
.lk .li{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,#0e0920);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.lk b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk small{display:flex;gap:8px;flex-wrap:wrap;color:var(--mute);font-size:11.5px;align-items:center}
.lk small span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40ch}
.lk .row{flex-wrap:nowrap;gap:6px}
.dz{border:1.5px dashed var(--line2);border-radius:14px;padding:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:var(--mute);font-size:13px;transition:background .15s,border-color .15s}
.dz.on{border-color:var(--green);background:#5ee08a12;color:var(--fg)}
.dz svg.i{width:26px;height:26px;color:var(--gold)}
.addlink{display:grid;grid-template-columns:1fr 1.4fr 150px auto;gap:8px;align-items:end;padding:12px;border-radius:12px;background:#0e092099;border:1.5px solid var(--line)}
pre.code{margin:0;background:#07040f;border:1.5px solid var(--line);border-radius:12px;padding:14px;overflow:auto;font:12.5px/1.55 ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;color:#e6dcff;max-height:420px;white-space:pre}
.notesarea{min-height:260px}
.tip{font-size:12px;color:var(--dim);margin:8px 0 0}

/* ---------- modals ---------- */
#modals{position:relative;z-index:60}
.mback{position:fixed;inset:0;background:#05020ccc;backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 16px max(12px,env(safe-area-inset-left,0px));overflow-y:auto;animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}}
.modal{width:min(1100px,100%);margin:auto 0;display:flex;flex-direction:column;max-height:none}
.modal.sm{width:min(520px,100%)}
.modal.md{width:min(720px,100%)}
.mhead{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1.5px solid var(--line)}
.mhead h3{margin:0;font:400 30px/1 var(--display);letter-spacing:.8px;color:var(--gold2);margin-right:auto}
.mbody{padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.mfoot{display:flex;gap:8px;align-items:center;padding:14px 20px;border-top:1.5px solid var(--line);flex-wrap:wrap;background:#0e092066;border-radius:0 0 18px 18px}
.mfoot .sp{margin-right:auto}
.x{border:0;background:none;color:var(--mute);padding:6px;border-radius:8px;display:grid;place-items:center}
.x:hover{background:var(--panel3);color:var(--fg)}
.sect{display:flex;flex-direction:column;gap:10px}
.sect>h5{margin:0;font:700 12px/1 var(--head);letter-spacing:2px;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:8px}
.sect>h5::after{content:"";flex:1;height:1px;background:var(--line)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.types{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.types button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 9px;border-radius:12px;border:1.5px solid var(--line);background:#0e0920;color:var(--mute);font:600 11.5px/1.1 var(--body);text-align:center}
.types button svg.i{width:24px;height:24px;color:var(--c)}
.types button:hover{border-color:var(--c)}
.types button.on{border-color:var(--c);color:var(--fg);background:color-mix(in srgb,var(--c) 16%,#0e0920);box-shadow:0 0 14px color-mix(in srgb,var(--c) 30%,transparent)}
.creator{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px}
.cside{display:flex;flex-direction:column;gap:14px;position:sticky;top:0;align-self:start}
.pcard{border-radius:16px;overflow:hidden;background:#0e0920;border:1.5px solid var(--c);box-shadow:0 0 24px color-mix(in srgb,var(--c) 25%,transparent)}
.pcard .art{height:170px;display:grid;place-items:center;position:relative;background:radial-gradient(ellipse at 50% 120%,color-mix(in srgb,var(--c) 45%,transparent),transparent 70%),#140c2a;color:var(--c)}
.pcard .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pcard .art svg.i{width:54px;height:54px;stroke-width:1.5}
.pcard .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px}
.pcard h4{margin:0;font:400 28px/1 var(--display);letter-spacing:.5px;color:var(--gold2);word-break:break-word}
.pcard p{margin:0;font-size:13px;color:#d6cdea}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.thumb{position:relative;border-radius:10px;overflow:hidden;border:1.5px solid var(--line);aspect-ratio:16/10;background:#0e0920}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumb.cov{border-color:var(--gold)}
.thumb .tb{position:absolute;inset:auto 4px 4px auto;display:flex;gap:3px}
.thumb .tb button{border:1px solid var(--ink);background:#0e0920dd;color:var(--fg);border-radius:6px;padding:3px;display:grid;place-items:center}
.thumb .tb button svg.i{width:13px;height:13px}
.thumb .star{position:absolute;top:4px;left:4px;font:800 9px/1 var(--body);background:var(--gold);color:#2a1604;padding:2px 5px;border-radius:5px}
.addthumb{border:1.5px dashed var(--line2);border-radius:10px;aspect-ratio:16/10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;color:var(--mute);font-size:11px;font-weight:600}
.addthumb:hover{border-color:var(--gold);color:var(--gold2)}
.tasks{display:flex;flex-direction:column;gap:6px}
.task{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:9px;background:#0e0920;border:1px solid var(--line)}
.task input[type=checkbox]{width:17px;height:17px;accent-color:var(--gold)}
.task input[type=text]{border:0;background:none;padding:2px 4px}
.task.done input[type=text]{text-decoration:line-through;color:var(--dim)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.err{color:var(--red);font-size:12px;font-weight:600}
.vchips{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- studio ---------- */
.studio{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px}
.sctl{display:flex;flex-direction:column;gap:12px}
.stage{display:flex;flex-direction:column;gap:12px;min-width:0}
.canvasbox{position:relative;border-radius:14px;overflow:hidden;border:1.5px solid var(--line);background:#07040f;aspect-ratio:16/9;display:grid;place-items:center}
.canvasbox canvas,.canvasbox img{width:100%;height:100%;object-fit:contain;display:block}
.canvasbox .ph{color:var(--dim);font-size:13px;text-align:center;padding:20px;display:flex;flex-direction:column;gap:8px;align-items:center}
.canvasbox.busy::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,#0000 30%,#ffffff14 50%,#0000 70%);background-size:200% 100%;animation:shim 1.2s linear infinite}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
.variants{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.variants button{padding:0;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:#07040f;aspect-ratio:16/9;position:relative}
.variants button.on{border-color:var(--gold);box-shadow:0 0 12px #ffc94a66}
.variants img,.variants canvas{width:100%;height:100%;object-fit:cover;display:block}
.variants .vfail{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:var(--red);padding:6px}
.swatches{display:flex;gap:5px;flex-wrap:wrap}
.swatches button{width:26px;height:26px;border-radius:8px;border:2px solid var(--ink);background:var(--c);padding:0}
.swatches button.on{outline:2px solid var(--gold);outline-offset:1px}
.realms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.realms button{display:flex;gap:8px;align-items:center;padding:7px 9px;border-radius:10px;border:1.5px solid var(--line);background:#0e0920;color:var(--mute);font:600 11.5px/1.15 var(--body);text-align:left}
.realms button i{width:18px;height:18px;border-radius:6px;flex:none;background:linear-gradient(135deg,var(--a),var(--b));border:1.5px solid var(--ink);box-shadow:0 0 6px var(--g)}
.realms button.on{border-color:var(--gold);color:var(--fg)}
#sk{touch-action:none;cursor:crosshair;background:#140c28}
.note{font-size:12px;color:var(--mute);background:#0e092099;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.note b{color:var(--fg)}
.lb{position:fixed;inset:0;z-index:80;background:#05020cee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb img{max-width:100%;max-height:calc(100vh - 140px);border-radius:12px;border:1.5px solid var(--line);box-shadow:0 20px 60px #000}
.lb .row{justify-content:center}
.lb p{margin:0;color:var(--mute);font-size:12.5px;max-width:80ch;text-align:center}

/* ---------- toast ---------- */
#toasts{position:fixed;z-index:100;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(520px,calc(100% - 32px))}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:center;background:#1b1438;border:1.5px solid var(--gold);box-shadow:0 0 0 1.5px var(--ink),0 10px 30px #000a;padding:10px 14px;border-radius:12px;font-size:13px;animation:up .2s ease-out}
.toast.bad{border-color:var(--red)}
.toast button{border:0;background:none;color:var(--gold2);font-weight:700;padding:0 2px}
@keyframes up{from{transform:translateY(10px);opacity:0}}

/* ---------- responsive ---------- */
@media (max-width:1100px){.creator{grid-template-columns:1fr}.cside{position:static}.studio{grid-template-columns:1fr}.types{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (max-width:900px){.work{grid-template-columns:1fr}.vault{position:static;max-height:none;order:2}.vlist{max-height:420px}.addlink{grid-template-columns:1fr 1fr}.addlink .btn{justify-self:start}}
@media (max-width:640px){
 .brand h1{font-size:34px}.brand canvas{width:42px;height:42px}
 .stat small{max-width:150px}
 .hcontent h2{font-size:38px}.hcontent{padding:18px 16px 16px}.hero{min-height:300px}
 .hactions{position:static;padding:12px 12px 0;justify-content:flex-start}
 .hero{flex-direction:column;align-items:stretch;justify-content:flex-end}
 .tbody{padding:14px}
 .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
 .types{grid-template-columns:repeat(4,minmax(0,1fr))}
 .variants{grid-template-columns:repeat(2,minmax(0,1fr))}
 .addlink{grid-template-columns:1fr}
 .lk{grid-template-columns:40px minmax(0,1fr)}.lk .row{grid-column:1/3;flex-wrap:wrap}
 .mhead h3{font-size:24px}
}
@media (max-width:420px){.g2{grid-template-columns:1fr}.types{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div id="app">
 <header class="top" id="top"></header>
 <section class="panel tlwrap" aria-label="Update timeline">
  <div class="tlhead">
   <h2>Update Timeline</h2>
   <div class="legend" id="legend"></div>
   <div class="row" style="gap:6px">
    <button class="btn icon ghost" id="zout" title="Zoom out" aria-label="Zoom out"></button>
    <button class="btn icon ghost" id="zin" title="Zoom in" aria-label="Zoom in"></button>
    <button class="btn sm ghost" id="ztoday">Today</button>
    <button class="btn sm" id="tlnew"></button>
   </div>
  </div>
  <div class="tl" id="tl"><div class="tltrack" id="track"></div></div>
  <p class="tlhint">Drag an update card sideways to change its date. Drag ideas from the vault onto a card to schedule them. Scroll or drag the empty space to pan.</p>
 </section>
 <main class="work">
  <aside class="panel vault" id="vault" aria-label="Idea Vault"></aside>
  <section class="panel board" id="board" aria-label="Selected update"></section>
 </main>
</div>
<div id="modals"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<input type="file" id="filepick" multiple hidden>
<input type="file" id="imgpick" accept="image/*" multiple hidden>
<input type="file" id="jsonpick" accept="application/json,.json" hidden>

const DAY=864e5,MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],MONL=['January','February','March','April','May','June','July','August','September','October','November','December'],WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const dnum=s=>{const[y,m,d]=String(s||'').split('-').map(Number);return y?Math.round(Date.UTC(y,(m||1)-1,d||1)/DAY):today()};
const dstr=n=>new Date(n*DAY).toISOString().slice(0,10);
const today=()=>{const d=new Date();return Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/DAY)};
const fmtD=s=>{const d=new Date(dnum(s)*DAY);return `${WD[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}`};
const fmtShort=s=>{const d=new Date(dnum(s)*DAY);return `${MON[d.getUTCMonth()]} ${d.getUTCDate()}`};
const rel=s=>{const n=dnum(s)-today();return n===0?'Today':n===1?'Tomorrow':n===-1?'Yesterday':n>0?`In ${n} days`:`${-n} days ago`};
const vparse=v=>String(v).split('.').map(x=>parseInt(x,10)||0);
const vcmp=(a,b)=>{const A=vparse(a),B=vparse(b);for(let i=0;i<Math.max(A.length,B.length);i++){const d=(A[i]||0)-(B[i]||0);if(d)return d}return 0};

/* ---------- storage: IndexedDB with a localStorage fallback ---------- */
const DB={db:null,
 open(){return new Promise(res=>{try{const r=indexedDB.open('tw-idea-forge',1);r.onupgradeneeded=()=>{const d=r.result;for(const s of['kv','img','file'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s)};r.onsuccess=()=>{DB.db=r.result;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false)}catch(e){res(false)}})},
 tx(store,mode,fn){return new Promise(res=>{if(!DB.db)return res(undefined);try{const t=DB.db.transaction(store,mode),st=t.objectStore(store);let out;const q=fn(st);if(q)q.onsuccess=()=>{out=q.result};t.oncomplete=()=>res(out);t.onerror=t.onabort=()=>res(undefined)}catch(e){res(undefined)}})},
 put(s,k,v){return DB.tx(s,'readwrite',st=>st.put(v,k))},
 get(s,k){return DB.tx(s,'readonly',st=>st.get(k))},
 del(s,k){return DB.tx(s,'readwrite',st=>st.delete(k))},
 clear(s){return DB.tx(s,'readwrite',st=>st.clear())},
 all(s){return new Promise(res=>{if(!DB.db)return res([]);try{const out=[],t=DB.db.transaction(s,'readonly'),c=t.objectStore(s).openCursor();c.onsuccess=()=>{const k=c.result;if(k){out.push([k.key,k.value]);k.continue()}};t.oncomplete=()=>res(out);t.onerror=()=>res(out)}catch(e){res([])}})}
};

  <p class="note">Draw with a mouse, pen or finger. <b>Glow</b> paints with a soft light, like the game's runes. Press Save when you like it.</p>`;
  showBox('<canvas id="sk" width="960" height="540"></canvas>');const c=q('#sk'),g=c.getContext('2d');SK.c=c;let col='#ffc94a',tool='brush',bg='#140c28',hist=[];
  g.fillStyle=bg;g.fillRect(0,0,960,540);
  const base=st.sketchData||(o.base&&imgSrc(o.base));o.base=null;if(base){const im=new Image();im.onload=()=>{const k=Math.min(960/im.width,540/im.height),w=im.width*k,h=im.height*k;g.drawImage(im,(960-w)/2,(540-h)/2,w,h);mark()};im.src=base}
  const mark=()=>setCur(c.toDataURL('image/webp',.9),{kind:'sketch',prompt:'Sketch'});
  const snap=()=>{hist.push(g.getImageData(0,0,960,540));if(hist.length>25)hist.shift()};
  $$('[data-c]',q('#ksw')).forEach(b=>b.onclick=()=>{col=b.dataset.c;$$('[data-c]',q('#ksw')).forEach(x=>x.classList.toggle('on',x===b))});q('#kcol').oninput=e=>{col=e.target.value;$$('[data-c]',q('#ksw')).forEach(x=>x.classList.remove('on'))};
  $$('[data-k]',q('#sctl')).forEach(b=>b.onclick=()=>{tool=b.dataset.k;$$('[data-k]',q('#sctl')).forEach(x=>x.classList.toggle('on',x===b))});
  q('#kun').onclick=()=>{const h=hist.pop();if(h){g.putImageData(h,0,0);mark()}};q('#kcl').onclick=()=>{snap();g.fillStyle=bg;g.fillRect(0,0,960,540);mark()};
  q('#kbg').onclick=()=>{snap();bg=col;g.save();g.globalCompositeOperation='destination-over';g.fillStyle=bg;g.fillRect(0,0,960,540);g.restore();g.fillStyle=bg;g.fillRect(0,0,960,540);mark()};
  q('#kimg').onclick=()=>{const p=$('#imgpick');p.value='';p.onchange=async()=>{const f=p.files[0];if(!f)return;const src=await shrink(f);const im=new Image();im.onload=()=>{snap();const k=Math.min(960/im.width,540/im.height),w=im.width*k,h=im.height*k;g.drawImage(im,(960-w)/2,(540-h)/2,w,h);mark()};im.src=src};p.click()};
  let last=null;const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*960/r.width,(e.clientY-r.top)*540/r.height]};
  c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);snap();last=pos(e);stroke(last,last,e)};
  c.onpointermove=e=>{if(!last)return;const p=pos(e);stroke(last,p,e);last=p};
  c.onpointerup=c.onpointercancel=()=>{if(last){last=null;mark()}};
  function stroke(a,b,e){const sz=+q('#ksz').value*(e.pressure&&e.pointerType==='pen'?.4+e.pressure:1);g.save();g.lineCap=g.lineJoin='round';g.lineWidth=sz;
   if(tool==='erase'){g.strokeStyle=bg}else{g.strokeStyle=col;if(tool==='glow'){g.shadowColor=col;g.shadowBlur=sz*2.2;g.globalCompositeOperation='lighter';g.globalAlpha=.7}}
   g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0]+.01,b[1]);g.stroke();g.restore()}}
 /* --- upload --- */
 function tUpload(){q('#sctl').innerHTML=`<p class="note">Add art you made elsewhere: drop image files on the box, choose files, or paste an image with Ctrl+V or Cmd+V.</p><button class="btn gold" id="uup" style="justify-content:center">${ic('upload')}Choose images</button>`;
  showBox(`<div class="ph">${ic('upload')}<span>Drop an image here</span></div>`);const box=q('#sbox');
  const load=async f=>{const src=await shrink(f);if(!src){toast('That file is not an image this browser can read.',1);return}showBox(`<img src="${src}" alt="">`);setCur(src,{kind:'upload',prompt:f.name||'Pasted image'})};
  box.ondragover=e=>{e.preventDefault()};box.ondrop=e=>{e.preventDefault();const f=[...e.dataTransfer.files].find(x=>/^image\//.test(x.type));if(f)load(f)};
  q('#uup').onclick=()=>{const p=$('#imgpick');p.value='';p.onchange=()=>{if(p.files[0])load(p.files[0])};p.click()};
  st.paste=e=>{const it=[...(e.clipboardData?.items||[])].find(x=>/^image\//.test(x.type));if(it&&st.tab==='upload'&&!m.closed)load(it.getAsFile())}}
 const onPaste=e=>st.paste&&st.paste(e);document.addEventListener('paste',onPaste);const oc=m.close;m.close=s=>{document.removeEventListener('paste',onPaste);oc(s)};
 q('#ssave').onclick=async()=>{if(!st.cur)return;const id=await putImage(Object.assign({src:st.cur},st.curMeta));
  if(o.onSave){o.onSave(id);toast('Art added to the idea');m.close();return}
  if(!target){toast('Choose where to save it first.',1);return}
  const owner=target.kind==='u'?U_(target.id):I_(target.id);if(!owner){toast('That update or idea no longer exists.',1);return}
  owner.art=owner.art||[];owner.art.push(id);if(!owner.cover)owner.cover=id;commit();toast(`Saved to ${target.kind==='u'?'update '+owner.ver:'“'+owner.title+'”'}`,0,target.kind==='u'&&owner.cover!==id?['Make cover',()=>{owner.cover=id;commit()}]:null)};
 q('#sdl').onclick=()=>{if(!st.cur)return;const a=document.createElement('a');a.href=st.cur;a.download=`type-warriors-concept-${Date.now()}.webp`;a.target='_blank';document.body.appendChild(a);a.click();a.remove()};
 q('#spaint').onclick=()=>{if(!st.cur)return;st.sketchData=st.cur;st.tab='sketch';tabs()};
 tabs()}

/* ===================================================================== SETTINGS, BACKUP, HELP */
function openSettings(){const s=S.settings;const m=modal(`<div class="mhead"><h3>Settings</h3><button class="x" data-x aria-label="Close">${ic('x')}</button></div>
 <div class="mbody">
  <label class="f">Live version<small>The update players have right now. It gets the LIVE badge.</small><select id="sl"><option value="">None</option>${sortedU().map(u=>`<option${u.ver===S.live?' selected':''} value="${esc(u.ver)}">${esc(u.ver)} · ${esc(u.name)}</option>`).join('')}</select></label>
  <label class="f">Days between updates<small>Used to suggest the date of the next update.</small><input type="number" id="sc" min="1" max="60" value="${s.cadence}"></label>
  <label class="f">AI image address<small>Use {prompt}, {w}, {h} and {seed}. The service must return an image.</small><input type="text" id="sa" value="${esc(s.aiUrl)}" style="font-family:ui-monospace,monospace;font-size:12.5px"></label>
  <label class="f">Style added to every AI prompt<textarea id="ss" rows="3">${esc(s.aiStyle)}</textarea></label>
 </div><div class="mfoot"><button class="btn sm ghost" id="sreset">Restore defaults</button><span class="sp"></span><button class="btn ghost" data-x>Cancel</button><button class="btn gold" id="ssv">Save</button></div>`,'md');
 $$('[data-x]',m.el).forEach(b=>b.onclick=()=>m.close());
 $('#sreset').onclick=()=>{const d=seedState().settings;$('#sa').value=d.aiUrl;$('#ss').value=d.aiStyle;$('#sc').value=d.cadence};
 $('#ssv').onclick=()=>{S.live=$('#sl').value;s.cadence=clamp(parseInt($('#sc').value)||4,1,60);s.aiUrl=$('#sa').value.trim()||seedState().settings.aiUrl;s.aiStyle=$('#ss').value.trim();m.close();commit();toast('Settings saved')}}
function openKeys(){const m=modal(`<div class="mhead"><h3>Shortcuts</h3><button class="x" data-x aria-label="Close">${ic('x')}</button></div><div class="mbody" style="gap:10px">
 ${[['N','New idea'],['U','New update'],['A','Concept Art Studio'],['/','Search the vault'],['Esc','Close a window'],['← →','Move the focused update card by a day'],['Ctrl + scroll','Zoom the timeline']].map(([k,v])=>`<div class="row" style="justify-content:space-between"><span>${v}</span><span class="chip" style="--c:var(--gold);font-family:ui-monospace,monospace">${k}</span></div>`).join('')}</div>`,'sm');$$('[data-x]',m.el).forEach(b=>b.onclick=()=>m.close())}
const b64=blob=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>res(null);r.readAsDataURL(blob)});
async function exportAll(){toast('Preparing the backup…');const files={};for(const[k,f]of FILES)files[k]={name:f.name,mime:f.mime,size:f.size,added:f.added,data:await b64(f.blob)};
 const out=JSON.stringify({app:'type-warriors-idea-forge',v:1,saved:new Date().toISOString(),state:S,images:Object.fromEntries(IMG),files});
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'application/json'}));a.download=`idea-forge-backup-${dstr(today())}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),30000);toast(`Backup saved (${fmtSize(out.length)})`)}
$('#jsonpick').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;let d;try{d=JSON.parse(await f.text())}catch(x){toast('That file is not an Idea Forge backup.',1);return}
 if(d.app!=='type-warriors-idea-forge'||!d.state){toast('That file is not an Idea Forge backup.',1);return}
 if(!await ask('Load this backup?',`It replaces everything here with the backup from ${esc(String(d.saved||'').slice(0,10))}: ${d.state.updates.length} updates and ${d.state.ideas.length} ideas.`,'Replace with backup'))return;
 S=Object.assign(seedState(),d.state);IMG.clear();FILES.clear();await DB.clear('img');await DB.clear('file');
 for(const[k,v]of Object.entries(d.images||{})){IMG.set(k,v);await DB.put('img',k,v)}
 for(const[k,v]of Object.entries(d.files||{})){try{const blob=await(await fetch(v.data)).blob();const rec={name:v.name,mime:v.mime,size:v.size,added:v.added,blob};FILES.set(k,rec);await DB.put('file',k,rec)}catch(x){}}
 commit();toast('Backup loaded')};
async function wipeAll(){if(!await ask('Start fresh?','This deletes every idea, every update you added, all concept art and all attached files, and puts back the original update history. Save a backup first if you might want them.','Delete everything'))return;
 S=seedState();IMG.clear();FILES.clear();await DB.clear('img');await DB.clear('file');commit();renderTimeline();tlScrollTo(today());toast('Started fresh')}

/* ===================================================================== RENDER LOOP */
function legend(){$('#legend').innerHTML=Object.values(USTAT).map(s=>`<span><i style="--c:${s.c}"></i>${s.n}</span>`).join('')+'<span><i style="--c:var(--pink)"></i>Live / today</span>'}
function commit(keep){save();renderTop();renderTimeline(1);renderVault();renderBoard()}
function stars(){const c=$('#stars'),g=c.getContext('2d');let pts=[];const size=()=>{c.width=innerWidth;c.height=innerHeight;pts=Array.from({length:Math.round(innerWidth*innerHeight/9000)},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.3+.2,p:Math.random()*6,s:.4+Math.random()*1.2}))};size();addEventListener('resize',size);
 const still=matchMedia('(prefers-reduced-motion: reduce)').matches;const draw=t=>{g.clearRect(0,0,c.width,c.height);for(const p of pts){const a=still?.5:.25+.5*(.5+.5*Math.sin(t/1000*p.s+p.p));g.fillStyle=`rgba(255,240,210,${a})`;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill()}if(!still)requestAnimationFrame(draw)};requestAnimationFrame(draw)}
async function boot(){stars();await DB.open();
 let st=await DB.get('kv','state');if(!st){try{st=JSON.parse(localStorage.getItem(LSKEY)||'null')}catch(e){}}
 S=st&&st.v===1&&Array.isArray(st.updates)?Object.assign(seedState(),st,{settings:Object.assign(seedState().settings,st.settings||{})}):seedState();
 for(const[k,v]of await DB.all('img'))IMG.set(k,v);for(const[k,v]of await DB.all('file'))FILES.set(k,v);
 if(!U_(S.sel))S.sel=(liveU()||sortedU()[0]||{}).id||null;
 $('#zin').innerHTML=ic('zin');$('#zout').innerHTML=ic('zout');$('#tlnew').innerHTML=ic('plus')+'New update';
 $('#zin').onclick=()=>zoom(1.3);$('#zout').onclick=()=>zoom(1/1.3);$('#ztoday').onclick=()=>tlScrollTo(today(),true);$('#tlnew').onclick=()=>openUpdate(null);
 legend();commit();const u=U_(S.sel);tlScrollTo(u?Math.max(dnum(u.date),today()-3):today());
 if(!DB.db)toast('This browser is blocking storage, so changes last only until you close the tab.',1)}
boot();
